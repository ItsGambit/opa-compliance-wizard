# GATE-06 (external review, 2026-10-05): one shared rate-limit zone for the
# two sign-in routes that make the gate call Okta or start a fresh MFA
# challenge. limit_req_zone is only valid in the http context; site files
# are included inside http {}, so it sits here, outside the server blocks
# (server/nginx_second_site.py copies only the HTTPS server block, so an
# additional gate's generated site reuses this zone instead of redefining it).
limit_req_zone $binary_remote_addr zone=opa_auth:1m rate=30r/m;

server {
    listen 80;
    server_name REPLACE_WITH_SERVER_NAME;
    # $server_name, not $host: the redirect target is this site's own name,
    # never whatever Host header a client sent.
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name REPLACE_WITH_SERVER_NAME;

    ssl_certificate /etc/nginx/ssl/opa-secrets-wizard.crt;
    ssl_certificate_key /etc/nginx/ssl/opa-secrets-wizard.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # GATE-06: browser hardening on every response from this site. add_header
    # is inherited by a location only when that location defines no
    # add_header of its own (nginx.org, ngx_http_headers_module) -- so no
    # location below may add one without repeating these. `always` adds them
    # to error responses (401/403/5xx) too.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # same-origin, not no-referrer: under no-referrer a browser sends
    # `Origin: null` on a same-origin form POST (WHATWG Fetch, "append a
    # request Origin header"), which serve.py's and the gate's Origin
    # checks would refuse.
    add_header Referrer-Policy "same-origin" always;
    # HSTS is opt-in: browsers ignore it for an IP address (RFC 6797
    # 8.1.1), and on a hostname with a self-signed certificate it removes
    # the "proceed anyway" option (RFC 6797 12.1). Enable it once this site
    # has a publicly trusted certificate, starting with a short max-age.
    # add_header Strict-Transport-Security "max-age=86400" always;
    limit_req_status 429;

    # Okta OIDC gate (server/auth_gate.py, 127.0.0.1:8767) -- see that file's
    # docstring for why this replaced plain HTTP Basic Auth.
    auth_request /verify;
    error_page 401 = /login;

    # SECURITY (external review, 2026-09-30, flagged independently by
    # multiple reviewers as the most severe finding): without this,
    # server/serve.py (127.0.0.1:8766) trusted X-Auth-Is-Admin/X-Auth-Sub
    # unconditionally -- any OTHER local process on this host (or a
    # hypothetical SSRF from some other local service) could set those
    # headers directly, bypassing this entire auth_request/login/step-up
    # flow completely. The literal value below MUST be replaced per
    # deployment (same convention this file already uses for
    # server_name/ssl_certificate above -- this is a template, not
    # meant to be used as-is) and must match NGINX_PROXY_SECRET in
    # /etc/opa-compliance-wizard.env (the same EnvironmentFile serve.py
    # already reads) -- see docs/hosting.md's "Hosting on a server" section.
    # Applied via proxy_set_header X-Nginx-Proxy-Secret on each location
    # below that proxies to 8766 -- serve.py's _request_is_from_nginx
    # requires an exact match before trusting ANY X-Auth-* header. This
    # is REQUIRED for any real hosted multi-user deployment, not optional.
    set $nginx_proxy_secret "REPLACE_WITH_NGINX_PROXY_SECRET_VALUE";

    # auth_request only gates access -- it does NOT forward the subrequest's
    # response headers into the main proxied request by default. These two
    # auth_request_set directives capture auth_gate.py's X-Auth-Sub/-User
    # response headers into nginx variables so the `location /` block below
    # can re-set them as request headers into serve.py. Without this, the
    # dashboard backend has no way to know who's actually logged in, which
    # defeats per-user environment scoping and audit-log attribution.
    auth_request_set $auth_sub      $upstream_http_x_auth_sub;
    auth_request_set $auth_user     $upstream_http_x_auth_user;
    auth_request_set $auth_is_admin $upstream_http_x_auth_is_admin;
    # 5.43.0: the Okta issuer of the gate that vouched for this user (a sub
    # is only unique within one org); serve.py keys per-user permission
    # exceptions on issuer + sub.
    auth_request_set $auth_issuer   $upstream_http_x_auth_issuer;

    location = /verify {
        internal;
        proxy_pass http://127.0.0.1:8767/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Same as /verify above, but additionally requires a fresh, unexpired
    # step-up (re-auth) cookie matching the current session -- see
    # auth_gate.py's _verify_session(require_stepup=True). Only
    # /api/access_control/save and /api/environment_changes/save (5.42.0)
    # point their auth_request here instead of the plain /verify; nginx auth_request directives don't chain/stack, so
    # this is a second, separate internal location rather than trying to
    # apply two auth_requests to one location.
    location = /verify_stepup {
        internal;
        proxy_pass http://127.0.0.1:8767/verify?require_stepup=1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Phase 8 of docs/fast-follow-redesign.md: unauthenticated by design
    # -- an external uptime monitor/load balancer has no Okta session to
    # present, and this endpoint holds no tenant data of its own (see
    # server/serve.py's /healthz route for exactly what it checks).
    # GATE-06: exact match -- a prefix match also let /healthzanything skip
    # the login. Client-sent identity headers are dropped here (an empty
    # proxy_set_header value means "don't pass the header"), and the proxy
    # secret is never attached, so serve.py answers this as anonymous
    # (status only in hosted mode).
    location = /healthz {
        auth_request off;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Sub "";
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Auth-Is-Admin "";
        proxy_set_header X-Auth-Issuer "";
        proxy_set_header X-Nginx-Issuer-Forwarded "";
        proxy_set_header X-Auth-Action-Id "";
        proxy_set_header X-Nginx-Stepup-Location "";
        proxy_set_header X-Nginx-Proxy-Secret "";
    }

    location /login {
        auth_request off;
        proxy_pass http://127.0.0.1:8767/login;
        proxy_set_header Host $host;
    }

    # Starts a fresh MFA challenge (see auth_gate.py's _start_login
    # purpose="step_up") -- used before saving Access Control changes and
    # (5.42.0) every Environments change, NOT part of ordinary login. auth_request off for the same reason /login
    # has it off: this endpoint IS part of the auth flow itself, so it must
    # not recursively require an already-passing auth check.
    location /step-up {
        auth_request off;
        limit_req zone=opa_auth burst=60 nodelay;
        proxy_pass http://127.0.0.1:8767/step-up;
        proxy_set_header Host $host;
    }

    # GATE-06: rate-limited -- each callback with a valid flow cookie makes
    # the gate POST to Okta's token endpoint, so an unthrottled loop could
    # spend the org's rate limit (a login outage). /login is deliberately
    # NOT limited: it makes no outbound call, and it is also the internal
    # error_page target for every 401, so limiting it would turn ordinary
    # session-expiry responses into 429s.
    location /authorization-code/callback {
        auth_request off;
        limit_req zone=opa_auth burst=60 nodelay;
        proxy_pass http://127.0.0.1:8767/authorization-code/callback;
        proxy_set_header Host $host;
    }

    location /logout {
        auth_request off;
        proxy_pass http://127.0.0.1:8767/logout;
        proxy_set_header Host $host;
    }

    # Overrides the server block's default `auth_request /verify` with the
    # step-up-checking variant above -- this is the ONE endpoint that
    # actually writes access_control.json (server/serve.py), so it's the
    # one place a fresh MFA proof is required in addition to an ordinary
    # admin session. GET /api/access_control (read-only) is intentionally
    # NOT listed here -- it stays under the server block's plain /verify,
    # same as every other admin-only read in this app.
    location /api/access_control/save {
        auth_request /verify_stepup;
        error_page 401 = /login;
        auth_request_set $auth_sub           $upstream_http_x_auth_sub;
        auth_request_set $auth_user          $upstream_http_x_auth_user;
        auth_request_set $auth_is_admin      $upstream_http_x_auth_is_admin;
        auth_request_set $auth_issuer        $upstream_http_x_auth_issuer;
        # Only /verify_stepup's response ever carries this (see
        # auth_gate.py's _verify_session) -- Phase 3's pending-action id,
        # bound into the step-up cookie itself, forwarded so serve.py can
        # retrieve the EXACT payload that was reviewed before step-up was
        # triggered (audit_store.consume_pending_admin_action), rather
        # than trusting the live request body for the settings themselves.
        auth_request_set $auth_action_id     $upstream_http_x_auth_action_id;

        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Sub $auth_sub;
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-Auth-Is-Admin $auth_is_admin;
        proxy_set_header X-Auth-Issuer $auth_issuer;
        # Tells serve.py this site overwrote X-Auth-Issuer (an older site passes
        # a client-sent copy through); the proxy secret, so no client can forge it.
        proxy_set_header X-Nginx-Issuer-Forwarded $nginx_proxy_secret;
        proxy_set_header X-Auth-Action-Id $auth_action_id;
        proxy_set_header X-Nginx-Stepup-Location "";
        proxy_set_header X-Nginx-Proxy-Secret $nginx_proxy_secret;
    }

    # 5.42.0: every change made from the Environments area (create, edit,
    # delete, share, sync settings, watermark reset, CSV import, orphaned
    # archive purge, shared-environment permissions) needs a fresh MFA
    # approval -- the same mechanism as /api/access_control/save above, for
    # every user, not only admins. serve.py stores the change as a pending
    # action, the browser goes through /step-up, and this location applies
    # it. X-Nginx-Stepup-Location proves to serve.py that the request came
    # through THIS location (a site without it fails closed: `location /`
    # below never sets it, and clears any client-sent copy). It carries the
    # proxy secret, not a constant, because an older site that doesn't
    # clear client-sent copies would pass a forged constant straight through.
    location = /api/environment_changes/save {
        auth_request /verify_stepup;
        error_page 401 = /login;
        auth_request_set $auth_sub           $upstream_http_x_auth_sub;
        auth_request_set $auth_user          $upstream_http_x_auth_user;
        auth_request_set $auth_is_admin      $upstream_http_x_auth_is_admin;
        auth_request_set $auth_issuer        $upstream_http_x_auth_issuer;
        auth_request_set $auth_action_id     $upstream_http_x_auth_action_id;

        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Sub $auth_sub;
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-Auth-Is-Admin $auth_is_admin;
        proxy_set_header X-Auth-Issuer $auth_issuer;
        # Tells serve.py this site overwrote X-Auth-Issuer (an older site passes
        # a client-sent copy through); the proxy secret, so no client can forge it.
        proxy_set_header X-Nginx-Issuer-Forwarded $nginx_proxy_secret;
        proxy_set_header X-Auth-Action-Id $auth_action_id;
        proxy_set_header X-Nginx-Stepup-Location $nginx_proxy_secret;
        proxy_set_header X-Nginx-Proxy-Secret $nginx_proxy_secret;
    }

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (not append) any X-Auth-Sub/-User/-Is-Admin a client
        # might have sent directly -- these must only ever reflect what
        # auth_gate.py's verified /verify subrequest just established
        # above, never a raw client-supplied header, since serve.py treats
        # them as verified identity for environment ownership, admin
        # override rights, and audit attribution.
        proxy_set_header X-Auth-Sub $auth_sub;
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-Auth-Is-Admin $auth_is_admin;
        proxy_set_header X-Auth-Issuer $auth_issuer;
        # Tells serve.py this site overwrote X-Auth-Issuer (an older site passes
        # a client-sent copy through); the proxy secret, so no client can forge it.
        proxy_set_header X-Nginx-Issuer-Forwarded $nginx_proxy_secret;
        # Only the two step-up locations may carry these (5.42.0): a
        # client-sent copy is dropped here (an empty value means "don't pass").
        proxy_set_header X-Auth-Action-Id "";
        proxy_set_header X-Nginx-Stepup-Location "";
        proxy_set_header X-Nginx-Proxy-Secret $nginx_proxy_secret;
    }
}
